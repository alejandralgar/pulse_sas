{% extends "base.html" %}
{% load static %}
{% block title %}Contraseña actualizada · Pulse SAS{% endblock %}
{% block content %}
<div class="auth-card dashboard-card">
    <div class="auth-header">
        <img src="{% static 'icono/logo.svg' %}" alt="Pulse SAS" class="auth-logo">
        <h1>Contraseña actualizada</h1>
        <p>Ya puedes iniciar sesión con tu nueva contraseña.</p>
    </div>

    <a href="{% url 'login' %}" class="btn-primary" style="display:block;text-decoration:none;text-align:center;">Ir a iniciar sesión</a>
</div>
{% endblock %}
